packaging_format = 2
id = "nuxt-dynqr"
name = "SoliQrCode"
description.en = "SoliQrCode – a Nuxt app that generates and manages branded dynamic QR codes for YunoHost"
description.fr = "SoliQrCode – une app Nuxt qui génère et gère des QR codes dynamiques personnalisés pour YunoHost"

version = "1.0.0~ynh1"

maintainers = ["ebanDev"]


[upstream]
license = "AGPL-3.0"
code = "https://github.com/Solidaires-Etudiant-e-s/SoliQrCode"

[integration]
yunohost = ">= 11.1"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = true
sso = true
disk = "100M"
ram.build = "1G"
ram.runtime = "512M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/dynqr"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.emulate_dynamicqrcode]
    ask.en = "Do you want to enable Dynamic QR Code emulation mode? This allows migrating from former Dynamic Qr code yunohost app by emulating its redirect links. Note that currently only redirections are emulated, you will have to migrate the database yourself."
    ask.fr = "Voulez-vous activer le mode d'émulation de code QR dynamique ? Cela permet de migrer depuis l'ancienne application yunohost Dynamic Qr code en émulant ses liens de redirection. Notez que pour l'instant seules les redirections sont émulées, vous devrez migrer la base de données vous-même."
    type = "boolean"
    default = false

[resources]
    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/Solidaires-Etudiant-e-s/SoliQrCode/archive/refs/tags/v1.0.0.tar.gz"
    sha256 = "c1c19da9358c305830bc526dcec49bf1613f1a174957933d4c999874f3566baa"
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"
    main.allowed = "all_users"

    admin.url = '/admin'
    admin.show_tile = false
    admin.allowed = "admins"

    public_redirects.url = '/l'
    public_redirects.show_tile = false
    public_redirects.allowed = "visitors"

    public_redirects_migrate_dynamicqr.url = '/read.php'
    public_redirects_migrate_dynamicqr.show_tile = false
    public_redirects_migrate_dynamicqr.allowed = "visitors"

    [resources.apt]
    packages = "mariadb-server"

    [resources.database]
    type = "mysql"

    [resources.nodejs]
    version = "22"

    [resources.data_dir]
